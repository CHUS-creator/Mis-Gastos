name: CI

run-name: CI @${{ github.event.pull_request.head.sha || github.sha }}

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Tests y build debug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ejecutar tests unitarios
        run: ./gradlew test --stacktrace

      - name: Compilar APK debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Calcular nombre del artefacto
        run: |
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "APK_ARTIFACT=app-debug-apk-${SHA::7}" >> "$GITHUB_ENV"
          echo "TEST_REPORTS_ARTIFACT=test-reports-${SHA::7}" >> "$GITHUB_ENV"

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_ARTIFACT }}
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Subir reportes de tests en fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TEST_REPORTS_ARTIFACT }}
          path: app/build/reports/tests/
