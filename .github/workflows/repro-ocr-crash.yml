name: Repro crash OCR en emulador

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
  push:
    branches: [feature/core-ocr]

jobs:
  repro:
    name: Emulador + logcat del crash
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: KVM
        run: |
          echo 'KERNEL==\"kvm\", GROUP=\"kvm\", MODE=\"0666\"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger /dev/kvm || true

      - name: Compilar APK debug
        run: ./gradlew assembleDebug --stacktrace

      - id: repro
        uses: reactivecircus/android-emulator-runner@v1
        continue-on-error: true
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            set -x
            mkdir -p $GITHUB_WORKSPACE/repro
            adb logcat -c
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.misgastos.app/.MainActivity
            sleep 12
            adb exec-out screencap -p > $GITHUB_WORKSPACE/repro/01_home.png

            # Función: dump UI y tocar un nodo por content-desc o text
            tap_node() {
              adb shell uiautomator dump /sdcard/ui.xml >/dev/null
              adb pull /sdcard/ui.xml $GITHUB_WORKSPACE/repro/ui.xml >/dev/null
              python3 - "$1" "$GITHUB_WORKSPACE/repro/ui.xml" <<'EOF'
            import re, sys, subprocess
            want = sys.argv[1]
            xml = open(sys.argv[2]).read()
            for m in re.finditer(r'<node[^>]*>', xml):
                node = m.group(0)
                desc = re.search(r'content-desc="([^"]*)"', node)
                text = re.search(r'text="([^"]*)"', node)
                if (desc and want in desc.group(1)) or (text and want in text.group(1)):
                    b = re.search(r'bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', node)
                    if b:
                        x = (int(b.group(1)) + int(b.group(3))) // 2
                        y = (int(b.group(2)) + int(b.group(4))) // 2
                        subprocess.run(['adb', 'shell', 'input', 'tap', str(x), str(y)])
                        sys.exit(0)
            sys.exit(1)
            EOF
            }

            # Abrir menú ⋮ (content-desc "Exportar") y luego Ajustes de reconocimiento
            if tap_node "Exportar"; then sleep 3; else echo "NO_MENU" >> $GITHUB_WORKSPACE/repro/status.txt; fi
            adb exec-out screencap -p > $GITHUB_WORKSPACE/repro/02_menu.png
            if tap_node "Ajustes de reconocimiento"; then sleep 8; else echo "NO_OCR_ITEM" >> $GITHUB_WORKSPACE/repro/status.txt; fi
            adb exec-out screencap -p > $GITHUB_WORKSPACE/repro/03_ocr_settings.png
            adb shell pidof com.misgastos.app > $GITHUB_WORKSPACE/repro/pid.txt || echo "APP_DEAD" >> $GITHUB_WORKSPACE/repro/status.txt
            sleep 5
            adb shell pidof com.misgastos.app >> $GITHUB_WORKSPACE/repro/pid.txt 2>/dev/null || echo "APP_DEAD_AFTER_WAIT" >> $GITHUB_WORKSPACE/repro/status.txt
            adb logcat -d > $GITHUB_WORKSPACE/repro/logcat_full.txt
            adb logcat -d -b crash > $GITHUB_WORKSPACE/repro/logcat_crash.txt

      - name: Subir resultados a la rama repro-ocr-results
        if: always()
        run: |
          set -x
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          git checkout -B repro-ocr-results
          mkdir -p repro-latest
          cp repro/*.txt repro-latest/ 2>/dev/null || true
          cp repro/*.png repro-latest/ 2>/dev/null || true
          git add repro-latest || true
          git commit -m "Resultados de la reproducción del crash OCR (commit ${{ github.sha }})" || true
          git push origin repro-ocr-results --force || true

      - name: Comentar en el PR via API
        if: always()
        run: |
          {
            echo "## Reproducción del crash OCR en emulador (API 34)"
            echo
            if [ -f repro/status.txt ]; then echo '```'; cat repro/status.txt; echo '```'; echo; fi
            if [ -f repro/logcat_crash.txt ] && [ -s repro/logcat_crash.txt ]; then
              echo "### Buffer de crash"
              echo
              echo '```'
              tail -80 repro/logcat_crash.txt
              echo '```'
              echo
            fi
            if [ -f repro/logcat_full.txt ] && grep -q "FATAL EXCEPTION" repro/logcat_full.txt; then
              echo "### FATAL EXCEPTION"
              echo
              echo '```'
              awk '/FATAL EXCEPTION/{f=1} f{print; n++} f&&n>120{exit}' repro/logcat_full.txt
              echo '```'
            fi
          } > comentario.md || true
          python3 - <<'EOF' || true
          import json
          body = open('comentario.md').read()
          data = json.dumps({'body': body})
          import urllib.request
          req = urllib.request.Request(
              'https://api.github.com/repos/' + __import__('os').environ['GITHUB_REPOSITORY'] + '/issues/12/comments',
              data=data.encode(), method='POST',
              headers={'Authorization': 'Bearer ' + __import__('os').environ['GH_TOKEN'],
                       'Accept': 'application/vnd.github+json',
                       'Content-Type': 'application/json'})
          print(urllib.request.urlopen(req).status)
          EOF
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Subir artefactos
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: repro-ocr-${{ github.sha }}
          path: repro/
