name: Repro crash OCR en emulador

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
  push:
    branches: [feature/core-ocr]

jobs:
  repro:
    name: Emulador + logcat del crash
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP=="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger /dev/kvm || true

      - name: Compilar APK debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Diagnóstico del entorno SDK
        run: |
          mkdir -p diag
          { echo "RUN_ID=${{ github.run_id }}"; date; echo "KVM:"; ls -la /dev/kvm || true; echo "ANDROID env:"; env | grep -i android || true; echo "SDK root:"; ls /usr/local/lib/android 2>/dev/null || ls $ANDROID_HOME 2>/dev/null || true; echo "Imágenes instaladas:"; $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list_installed 2>/dev/null || /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --list_installed 2>/dev/null || true; } > diag/entorno.txt 2>&1 || true

      - name: Repro en emulador
        uses: reactivecircus/android-emulator-runner@v1
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          emulator-boot-timeout: 900
          script: |
            mkdir -p "$GITHUB_WORKSPACE/repro"
            echo "SCRIPT_STARTED" >> "$GITHUB_WORKSPACE/repro/status.txt"
            exec > >(tee -a "$GITHUB_WORKSPACE/repro/script.log") 2>&1
            set -x
            adb devices -l || true
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.misgastos.app/.MainActivity
            sleep 15
            adb shell pidof com.misgastos.app >> "$GITHUB_WORKSPACE/repro/status.txt" || echo "APP_DEAD_AL_ARRANCAR" >> "$GITHUB_WORKSPACE/repro/status.txt"
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/repro/01_home.png"

            tap_node() {
              adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1
              adb pull /sdcard/ui.xml "$GITHUB_WORKSPACE/repro/ui.xml" >/dev/null 2>&1
              python3 - "$1" "$GITHUB_WORKSPACE/repro/ui.xml" <<'PYEOF'
            import re, sys, subprocess
            want = sys.argv[1]
            try:
                xml = open(sys.argv[2]).read()
            except Exception:
                sys.exit(1)
            for m in re.finditer(r'<node[^>]*>', xml):
                node = m.group(0)
                desc = re.search(r'content-desc="([^"]*)"', node)
                text = re.search(r'text="([^"]*)"', node)
                if (desc and want in desc.group(1)) or (text and want in text.group(1)):
                    b = re.search(r'bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', node)
                    if b:
                        x = (int(b.group(1)) + int(b.group(3))) // 2
                        y = (int(b.group(2)) + int(b.group(4))) // 2
                        subprocess.run(['adb', 'shell', 'input', 'tap', str(x), str(y)])
                        sys.exit(0)
            sys.exit(1)
            PYEOF
            }

            if tap_node "Exportar"; then sleep 3; else echo "NO_MENU" >> "$GITHUB_WORKSPACE/repro/status.txt"; fi
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/repro/02_menu.png"
            if tap_node "Ajustes de reconocimiento"; then sleep 8; else echo "NO_OCR_ITEM" >> "$GITHUB_WORKSPACE/repro/status.txt"; fi
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/repro/03_ocr_settings.png"
            adb shell pidof com.misgastos.app >> "$GITHUB_WORKSPACE/repro/status.txt" || echo "APP_DEAD_EN_AJUSTES" >> "$GITHUB_WORKSPACE/repro/status.txt"
            sleep 5
            adb logcat -d > "$GITHUB_WORKSPACE/repro/logcat_full.txt"
            adb logcat -d -b crash > "$GITHUB_WORKSPACE/repro/logcat_crash.txt"
            grep -c "FATAL EXCEPTION" "$GITHUB_WORKSPACE/repro/logcat_full.txt" >> "$GITHUB_WORKSPACE/repro/status.txt" || true

      - name: Subir resultados a la rama repro-ocr-results
        if: always()
        run: |
          mkdir -p repro-latest
          echo "RUN_ID=${{ github.run_id }} SHA=${{ github.sha }}" > repro-latest/info.txt
          cp -r diag/. repro-latest/ 2>/dev/null || true
          cp -r repro/. repro-latest/ 2>/dev/null || true
          ls -laR repro-latest > repro-latest/listing.txt 2>&1 || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          git checkout -B repro-ocr-results
          git add repro-latest
          git commit -m "Resultados repro OCR (run ${{ github.run_id }})"
          git push origin repro-ocr-results --force

      - name: Comentar en el PR via API
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Repro del crash OCR en emulador (run ${{ github.run_id }})"
            echo
            if [ -f repro/status.txt ]; then echo '```'; cat repro/status.txt; echo '```'; echo; fi
            if [ -s repro/logcat_crash.txt ]; then
              echo "### Buffer de crash"; echo
              echo '```'; tail -80 repro/logcat_crash.txt; echo '```'; echo
            fi
            if grep -q "FATAL EXCEPTION" repro/logcat_full.txt 2>/dev/null; then
              echo "### FATAL EXCEPTION"; echo
              echo '```'
              awk '/FATAL EXCEPTION/{f=1} f{print; n++} f&&n>120{exit}' repro/logcat_full.txt
              echo '```'
            fi
            echo; echo "Detalle completo en la rama \`repro-ocr-results\` (repro-latest/)."
          } > comentario.md || true
          python3 - <<'PYEOF' || true
          import json, os, urllib.request
          body = open('comentario.md').read()
          data = json.dumps({'body': body}).encode()
          req = urllib.request.Request(
              'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/issues/12/comments',
              data=data, method='POST',
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                       'Accept': 'application/vnd.github+json',
                       'Content-Type': 'application/json'})
          print(urllib.request.urlopen(req).status)
          PYEOF
